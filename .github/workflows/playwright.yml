name: Playwright Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  repository_dispatch:
    types: [main_repo_release]
  workflow_dispatch:

jobs:
  test:
    name: Test - ${{ matrix.project }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Show linked release context
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "Triggered from: ${{ github.event.client_payload.source_repo }}"
          echo "Release tag: ${{ github.event.client_payload.release_tag }}"

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30

  deploy-pages:
    name: Deploy Chromium report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))

    steps:
      - uses: actions/checkout@v4
      - name: Download Chromium report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report

      - name: Deploy report
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
